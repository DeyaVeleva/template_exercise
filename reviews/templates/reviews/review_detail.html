{% extends 'base.html' %}
{% load review_extras %}

{% block content %}
<div class="card shadow-sm p-4 bg-white">
    <h1 class="mb-2">{{ page_title }}</h1>
    <p class="text-muted">Written by <strong>{{ review.author }}</strong> on {{ review.created_at|date:"Y-m-d H:i" }}</p>
    <div class="mb-3">
        <span class="badge bg-warning text-dark fs-6">Rating: {{ review.rating|stars }}</span>
    </div>
    <hr>
    <p class="fs-5 line-height-lg">{{ review.body }}</p>
    <hr>
    <div class="d-flex gap-2">
        <a href="{% url 'book_detail' review.book.slug %}" class="btn btn-primary">View This Book</a>
        <a href="{% url 'recent_reviews' %}" class="btn btn-secondary">Back to Reviews</a>
    </div>
</div>
{% endblock %}

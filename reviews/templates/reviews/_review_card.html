{% load review_extras %}
<div class="card shadow-sm mb-3">
    <div class="card-body">
        <h5 class="card-title fw-bold">{{ review.author }}</h5>
        <h6 class="card-subtitle mb-2 text-muted">Book: <a href="{% url 'book_detail' review.book.slug %}">{{ review.book.title }}</a></h6>
        <p class="card-text">{{ review.body|truncatechars:100 }}</p>
        <div class="d-flex justify-content-between align-items-center">
            <span class="badge bg-warning text-dark">Rating: {{ review.rating|stars }}</span>
            <a href="{% url 'review_detail' review.pk %}" class="btn btn-sm btn-outline-secondary">Read Full Review</a>
        </div>
    </div>
</div>

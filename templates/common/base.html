
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Quicksand:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <title>{% block title %}{{ page_title }}{% endblock %}</title>

    <style>
        :root {
            --lavender: #a78bfa;
            --lavender-dark: #8061d9;
            --pink: #ffb7c9;
            --cream: #fffaf3;
            --mint: #c8f0df;
            --yellow: #ffe8a3;
            --text: #39334b;
            --muted: #827b91;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: var(--cream);
            color: var(--text);
            font-family: 'Nunito', sans-serif;
        }

        /* Navigation */
        .book-navbar {
            background: rgba(255, 255, 255, 0.94);
            border-bottom: 2px solid #f0e8ff;
            padding: 14px 0;
            box-shadow: 0 4px 20px rgba(91, 66, 130, 0.05);
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            color: var(--text);
            font-family: 'Quicksand', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            text-decoration: none;
        }

        .brand:hover {
            color: var(--lavender-dark);
        }

        .brand img {
            width: 46px;
            height: 46px;
            object-fit: contain;
            border-radius: 14px;
            background: #f0e8ff;
            padding: 5px;
        }

        .brand-accent {
            color: var(--lavender-dark);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .book-navbar .nav-link {
            color: var(--text);
            font-weight: 800;
            padding: 10px 18px;
            border-radius: 999px;
            transition: background-color 0.2s ease,
                        color 0.2s ease,
                        transform 0.2s ease;
        }

        .book-navbar .nav-link:hover {
            background: #f0e8ff;
            color: var(--lavender-dark);
            transform: translateY(-2px);
        }

        .nav-highlight {
            background: var(--lavender);
            color: white !important;
        }

        .nav-highlight:hover {
            background: var(--lavender-dark) !important;
            color: white !important;
        }

        /* Main content */
        main {
            flex: 1;
            width: 100%;
        }

        .page-container {
            padding-top: 36px;
            padding-bottom: 56px;
        }

        /* Reusable playful button */
        .btn-playful {
            display: inline-block;
            border: none;
            border-radius: 999px;
            padding: 11px 22px;
            background: var(--lavender);
            color: white;
            font-weight: 800;
            text-decoration: none;
            transition: transform 0.2s ease,
                        box-shadow 0.2s ease,
                        background-color 0.2s ease;
        }

        .btn-playful:hover {
            background: var(--lavender-dark);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(128, 97, 217, 0.2);
        }

        /* Reusable card style */
        .playful-card {
            background: white;
            border: 1px solid #f0e8ff;
            border-radius: 22px;
            padding: 24px;
            box-shadow: 0 6px 24px rgba(91, 66, 130, 0.05);
            transition: transform 0.2s ease,
                        box-shadow 0.2s ease;
        }

        .playful-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(91, 66, 130, 0.1);
        }

        h1, h2, h3, h4, h5 {
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            color: var(--text);
        }

        /* Footer */
        .book-footer {
            padding: 22px 16px;
            text-align: center;
            background: #f0e8ff;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .footer-heart {
            color: #ed83a4;
        }

        /* Mobile navigation */
        @media (max-width: 576px) {
            .book-navbar {
                padding: 12px 0;
            }

            .brand {
                font-size: 1.25rem;
            }

            .brand img {
                width: 38px;
                height: 38px;
            }

            .nav-links {
                gap: 2px;
            }

            .book-navbar .nav-link {
                padding: 8px 10px;
                font-size: 0.85rem;
            }

            .page-container {
                padding-top: 24px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition: none !important;
                scroll-behavior: auto !important;
            }
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>

<body>
    <header>
        <nav class="navbar book-navbar">
            <div class="container d-flex flex-wrap
                        align-items-center justify-content-between gap-3">

                <a class="brand"
                   href="{% url 'books:landing-page' %}">
                    <img src="{% static 'img.png' %}"
                         alt="Book Hub logo">
                    <span>Book <span class="brand-accent">Hub</span></span>
                </a>

                <div class="nav-links">
                    <a class="nav-link"
                       href="{% url 'books:list' %}">
                        📚 Books
                    </a>

                    <a class="nav-link nav-highlight"
                       href="{% url 'reviews:list' %}">
                        💌 Reviews
                    </a>
                </div>

            </div>
        </nav>
    </header>

    <main class="container page-container">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="book-footer">
        Made with <span class="footer-heart">♥</span> and a love for books
        <div class="mt-1">Book Hub · 2026</div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
